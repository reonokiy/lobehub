name: CNPG compatible image

on:
  push:
    branches: [cnpg-pg-like]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnpg-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'reonokiy/lobehub'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/cnpg/Dockerfile
          platforms: linux/amd64
          load: true
          tags: lobehub-cnpg:test
      - name: Test migration policy, signing keys and PG18 physical replication
        run: python3 deploy/cnpg/test-isolated.py lobehub-cnpg:test
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/cnpg/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/reonokiy/lobehub:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Image summary
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Published ghcr.io/reonokiy/lobehub@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
